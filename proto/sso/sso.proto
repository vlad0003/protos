syntax = "proto3";

option go_package = "internal/gen/user;userpb";

package user;

service UserService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
    rpc LoginUser (LoginUserRequest) returns (LoginUserResponse);
    rpc GetUserById (GetUserByIdRequest) returns (GetUserByIdResponse);
    rpc GetAccountById (GetAccountByIdRequest) returns (GetAccountByIdResponse);
    rpc TopUpBalance (TopUpBalanceRequest) returns (TopUpBalanceResponse);
}

message CreateUserRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message CreateUserResponse {
    string id = 1;
    string name = 2;
    string email = 3;
}

message LoginUserRequest {
    string email = 1;
    string password = 2;
}

message LoginUserResponse {
    string id = 1;
    bool success = 2;
    string message = 3;
}

message GetUserByIdRequest {
    string id = 1;
}

message GetUserByIdResponse {
    string id = 1;
    string name = 2;
    string email = 3;
}

message GetAccountByIdRequest {
    string id = 1;
}

message GetAccountByIdResponse {
    string id = 1;
    string name = 2;
    string email = 3;
    double balance = 4;
    string currency = 5;
}

message TopUpBalanceRequest {
    string email = 1;
    double moneyCount = 2;
}

message TopUpBalanceResponse {
    bool success = 1;
}
