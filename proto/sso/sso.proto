syntax = "proto3";

package auth;

option go_package = "gen/go/sso";

package user;

service UserService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
    string name = 1;
    string email = 2;
}

message CreateUserResponse {
    string id = 1;
    string name = 2;
    string email = 3;
}
